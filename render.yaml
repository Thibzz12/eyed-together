services:
  - type: web
    name: eyedtogether
    env: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7   # évite la 3.14 par défaut : pas de wheel précompilé pour pydantic-core dessus, échec de build
      - key: ENVIRONMENT
        value: development   # garde la création auto des tables (SQLite) + /auth/dev-login pour le test rapide
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./coworking.db
      - key: FRONTEND_ORIGIN
        value: https://eyedtogether.onrender.com
      - key: WORDPRESS_URL
        value: https://weared.team
      - key: WP_APP_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
